<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sea Battle HTML</title>
<style>
  body { margin: 0; overflow: hidden; background: #003; }
  #gameCanvas {
    width: 100vw;
    height: 100vh;
    background: linear-gradient(#1a3d6b, #0a1a33);
    display: block;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
// ===============================
// 基本設定
// ===============================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// ===============================
// プレイヤー船
// ===============================
const player = {
  x: canvas.width / 2,
  y: canvas.height / 2 + 150,
  angle: 0,
  speed: 2,
  size: 30,
  hp: 10
};

// ===============================
// 敵艦
// ===============================
const enemies = [];

function spawnEnemies() {
  enemies.length = 0;
  for (let i = 0; i < 5; i++) {
    enemies.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height / 2,
      angle: Math.random() * Math.PI * 2,
      speed: 1.2,
      size: 25,
      hp: 3,
      shootCooldown: 0
    });
  }
}

spawnEnemies();

let respawnTimer = 0;

// ===============================
// 砲弾（プレイヤー）
const bullets = [];

// 砲弾（敵）
const enemyBullets = [];

function shoot() {
  bullets.push({
    x: player.x,
    y: player.y,
    angle: player.angle,
    speed: 6
  });
}

document.addEventListener("click", shoot);

// ===============================
// ゲームループ
// ===============================
function update() {
  if (player.hp <= 0) return;

  // プレイヤー操作
  if (keys["w"]) {
    player.x += Math.sin(player.angle) * player.speed;
    player.y -= Math.cos(player.angle) * player.speed;
  }
  if (keys["s"]) {
    player.x -= Math.sin(player.angle) * player.speed;
    player.y += Math.cos(player.angle) * player.speed;
  }
  if (keys["a"]) player.angle -= 0.05;
  if (keys["d"]) player.angle += 0.05;

  // プレイヤー砲弾更新
  bullets.forEach(b => {
    b.x += Math.sin(b.angle) * b.speed;
    b.y -= Math.cos(b.angle) * b.speed;
  });

  // 敵AI
  enemies.forEach(e => {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);

    // プレイヤー方向へ旋回
    e.angle = Math.atan2(dx, -dy);

    // 距離を保ちながら接近
    if (dist > 200) {
      e.x += Math.sin(e.angle) * e.speed;
      e.y -= Math.cos(e.angle) * e.speed;
    }

    // 敵の砲撃
    if (dist < 400) {
      if (e.shootCooldown <= 0) {
        enemyBullets.push({
          x: e.x,
          y: e.y,
          angle: e.angle,
          speed: 4
        });
        e.shootCooldown = 60; // 約1秒
      }
    }

    e.shootCooldown--;
  });

  // 敵砲弾更新
  enemyBullets.forEach(b => {
    b.x += Math.sin(b.angle) * b.speed;
    b.y -= Math.cos(b.angle) * b.speed;
  });

  // プレイヤーが敵砲弾を受ける
  enemyBullets.forEach(b => {
    const dist = Math.hypot(b.x - player.x, b.y - player.y);
    if (dist < player.size) {
      player.hp--;
      b.x = -9999;
    }
  });

  // プレイヤー砲弾 → 敵に命中
  bullets.forEach(b => {
    enemies.forEach(e => {
      const dist = Math.hypot(b.x - e.x, b.y - e.y);
      if (dist < e.size) {
        e.hp--;
        b.x = -9999;
      }
    });
  });

  // HP0の敵を削除
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].hp <= 0) enemies.splice(i, 1);
  }
}

function checkRespawn() {
  if (player.hp <= 0) return;

  if (enemies.length === 0 && respawnTimer === 0) {
    respawnTimer = Date.now() + 5000;
  }

  if (respawnTimer !== 0 && Date.now() > respawnTimer) {
    spawnEnemies();
    respawnTimer = 0;
  }
}

// ===============================
// 描画
// ===============================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 海
  ctx.fillStyle = "#0a1a33";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // プレイヤー船
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  ctx.fillStyle = "#4af";
  ctx.fillRect(-player.size/2, -player.size, player.size, player.size * 1.8);

  ctx.beginPath();
  ctx.moveTo(-player.size/2, -player.size);
  ctx.lineTo(player.size/2, -player.size);
  ctx.lineTo(0, -player.size * 1.8);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // 敵艦
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);

    ctx.fillStyle = "#f44";
    ctx.fillRect(-e.size/2, -e.size, e.size, e.size * 1.6);

    ctx.beginPath();
    ctx.moveTo(-e.size/2, -e.size);
    ctx.lineTo(e.size/2, -e.size);
    ctx.lineTo(0, -e.size * 1.6);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  });

  // プレイヤー砲弾
  ctx.fillStyle = "#ff0";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // 敵砲弾
  ctx.fillStyle = "#0ff";
  enemyBullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // HP表示
  ctx.fillStyle = "#fff";
  ctx.font = "24px Arial";
  ctx.fillText("HP: " + player.hp, 20, 40);

  // ゲームオーバー
  if (player.hp <= 0) {
    ctx.fillStyle = "#f00";
    ctx.font = "60px Arial";
    ctx.fillText("GAME OVER", canvas.width / 2 - 150, canvas.height / 2);
  }
}

// ===============================
// メインループ
// ===============================
function loop() {
  update();
  checkRespawn();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
