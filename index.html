<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sea Battle</title>
<style>
  body { margin:0; overflow:hidden; background:#003; }
  #gameCanvas { width:100vw; height:100vh; display:none; background:#002; }

  /* タイトル画面 */
  #titleScreen {
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    background:#001a33;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Arial;
    z-index:99999;
  }
  #titleScreen h1 {
    font-size:64px;
    margin-bottom:40px;
  }
  #startBtn {
    font-size:32px;
    padding:20px 40px;
    background:#0af;
    border:none;
    border-radius:10px;
    color:white;
  }

  /* モード切替ボタン */
  #modeSwitch {
    position:fixed; top:10px; right:10px; z-index:9999;
    display:none;
  }
  #modeSwitch button {
    font-size:18px; padding:8px 16px; margin-left:6px;
  }

  /* スマホUI */
  #joystick, #fireBtn { display:none; }

  #joystick {
    position:fixed; bottom:20px; left:20px;
    width:140px; height:140px;
    background:rgba(255,255,255,0.1);
    border-radius:50%; border:2px solid #fff;
    z-index:9998; touch-action:none;
  }
  #joystick-inner {
    position:absolute; width:60px; height:60px;
    background:rgba(255,255,255,0.4);
    border-radius:50%; left:40px; top:40px;
  }

  #fireBtn {
    position:fixed; bottom:40px; right:40px;
    width:120px; height:120px;
    background:rgba(255,0,0,0.4);
    border-radius:50%; border:2px solid #fff;
    z-index:9998; touch-action:none;
  }
</style>
</head>
<body>

<!-- タイトル画面 -->
<div id="titleScreen">
  <h1>SEA BATTLE</h1>
  <button id="startBtn">START</button>
</div>

<!-- モード切替 -->
<div id="modeSwitch">
  <button id="pcModeBtn">PCモード</button>
  <button id="mobileModeBtn">スマホモード</button>
</div>

<canvas id="gameCanvas" tabindex="0"></canvas>

<!-- スマホUI -->
<div id="joystick"><div id="joystick-inner"></div></div>
<div id="fireBtn"></div>

<script>
/* ============================
   タイトル → ゲーム開始
============================ */
startBtn.onclick = ()=>{
  titleScreen.style.display = "none";
  gameCanvas.style.display = "block";
  modeSwitch.style.display = "block";
};

/* ============================
   モード切替
============================ */
let mobileMode = false;

function updateUIMode(){
  const j = document.getElementById("joystick");
  const f = document.getElementById("fireBtn");
  if(mobileMode){
    j.style.display="block";
    f.style.display="block";
  } else {
    j.style.display="none";
    f.style.display="none";
  }
}

pcModeBtn.onclick = ()=>{ mobileMode=false; updateUIMode(); };
mobileModeBtn.onclick = ()=>{ mobileMode=true; updateUIMode(); };

/* ============================
   基本設定
============================ */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;
canvas.focus();

/* キー入力 */
let keys = {};
window.onkeydown = e => keys[e.key] = true;
window.onkeyup = e => keys[e.key] = false;

/* マウス射撃 */
let mouseDown = false;
window.onmousedown = ()=> mouseDown = true;
window.onmouseup = ()=> mouseDown = false;

/* ============================
   スマホUI（安定操作版）
============================ */
const joy = document.getElementById("joystick");
const joyInner = document.getElementById("joystick-inner");
let touchShoot = false;

fireBtn.ontouchstart = ()=>{ if(mobileMode) touchShoot = true; };
fireBtn.ontouchend   = ()=> touchShoot = false;

joy.ontouchmove = e=>{
  if (document.getElementById("joystick").style.display !== "block") return;

  const t = e.touches[0];
  const rect = joy.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  let dx = t.clientX - cx;
  let dy = t.clientY - cy;

  const dist = Math.hypot(dx, dy);
  const maxDist = 50;

  if(dist > maxDist){
    dx = dx/dist * maxDist;
    dy = dy/dist * maxDist;
  }

  joyInner.style.left = (40 + dx) + "px";
  joyInner.style.top  = (40 + dy) + "px";

  /* ★ 方向ベクトルから角度を決める（勝手に回らない） */
  if(dist > 5){
    player.angle = Math.atan2(dx, -dy);
  }

  /* ★ 距離に応じて前進・後退（勝手に進まない） */
  const forward = dist > 5 ? dist / maxDist : 0;

  player.x += Math.sin(player.angle) * forward * player.speed;
  player.y -= Math.cos(player.angle) * forward * player.speed;
};

joy.ontouchend = ()=>{
  joyInner.style.left="40px";
  joyInner.style.top="40px";
  // 完全停止（角度・移動ともに0）
};

/* ============================
   プレイヤー
============================ */
const player = {
  x: canvas.width/2,
  y: canvas.height/2+150,
  angle:0,
  speed:2,
  size:30,
  hp:50,
  maxHp:50,
  healBonus:1,
  bulletSpeed:6,
  shootCooldown:0,
  shootCooldownBase:20
};

/* ============================
   ゲーム要素
============================ */
let wave = 1;
let abilityText = "";
let abilityTimer = 0;

const explosions = [];
let missileUnlocked = false;
let missileGiven = false;
let missileCooldown = 0;
const missiles = [];

const enemies = [];
const bullets = [];
const enemyBullets = [];

function spawnEnemies(){
  enemies.length = 0;
  const count = 5 + (wave-1)*2;
  for(let i=0;i<count;i++){
    enemies.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height/2,
      angle:Math.random()*Math.PI*2,
      speed:1.2,
      size:25,
      hp:3+wave,
      shootCooldown:0
    });
  }
}
spawnEnemies();

let respawnTimer = 0;

/* ============================
   射撃
============================ */
function shoot(){
  bullets.push({
    x:player.x,
    y:player.y,
    angle:player.angle,
    speed:player.bulletSpeed
  });
}

/* ============================
   ミサイル
============================ */
function launchMissile(){
  if(enemies.length===0) return;
  let target = enemies[0];
  let min = Infinity;
  enemies.forEach(e=>{
    const d = Math.hypot(e.x-player.x, e.y-player.y);
    if(d<min){ min=d; target=e; }
  });
  missiles.push({ x:player.x, y:player.y, target, speed:5 });
}

/* ============================
   能力
============================ */
let enemyShootCooldownBase = 180;

function giveRandomAbility(){
  const abilities = [
    "攻撃速度アップ","移動速度アップ",
    "最大HPアップ","回復量アップ",
    "砲弾速度アップ"
  ];
  const choice = abilities[Math.floor(Math.random()*abilities.length)];
  abilityText = "能力獲得: "+choice;
  abilityTimer = Date.now()+3000;

  if(choice==="攻撃速度アップ"){
    enemyShootCooldownBase = Math.max(60, enemyShootCooldownBase-20);
    player.shootCooldownBase = Math.max(5, player.shootCooldownBase-3);
  }
  if(choice==="移動速度アップ") player.speed+=0.5;
  if(choice==="最大HPアップ"){ player.maxHp+=10; player.hp+=10; }
  if(choice==="回復量アップ") player.healBonus+=1;
  if(choice==="砲弾速度アップ") player.bulletSpeed+=1;

  if(!missileGiven){
    missileUnlocked = true;
    missileGiven = true;
    abilityText = "能力獲得: ミサイル";
    abilityTimer = Date.now()+3000;
  }
}

/* ============================
   update（PCも安定操作）
============================ */
function update(){
  if(player.hp<=0) return;

  /* PC操作（押してる時だけ動く） */
  if(!mobileMode){
    if(keys["a"]) player.angle -= 0.05;
    if(keys["d"]) player.angle += 0.05;

    if(keys["w"]){
      player.x += Math.sin(player.angle) * player.speed;
      player.y -= Math.cos(player.angle) * player.speed;
    }
    if(keys["s"]){
      player.x -= Math.sin(player.angle) * player.speed;
      player.y += Math.cos(player.angle) * player.speed;
    }
  }

  /* 射撃 */
  if((mouseDown||touchShoot)&&player.shootCooldown<=0){
    shoot();
    player.shootCooldown = player.shootCooldownBase;
  }
  player.shootCooldown--;

  /* ミサイル */
  if(missileUnlocked && missileCooldown<=0){
    launchMissile();
    missileCooldown = 180;
  }
  missileCooldown--;

  /* ミサイル移動 */
  missiles.forEach(m=>{
    if(!m.target) return;
    const dx = m.target.x - m.x;
    const dy = m.target.y - m.y;
    const ang = Math.atan2(dx,-dy);
    m.x += Math.sin(ang)*m.speed;
    m.y -= Math.cos(ang)*m.speed;
    if(Math.hypot(m.x-m.target.x, m.y-m.target.y) < m.target.size){
      m.target.hp = 0;
      explosions.push({ x:m.target.x, y:m.target.y, radius:5, alpha:1 });
      m.x = -9999;
    }
  });

  /* プレイヤー砲弾 */
  bullets.forEach(b=>{
    b.x += Math.sin(b.angle)*b.speed;
    b.y -= Math.cos(b.angle)*b.speed;
  });

  /* 敵AI */
  enemies.forEach(e=>{
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx,dy);
    e.angle = Math.atan2(dx,-dy);

    if(dist>200){
      e.x += Math.sin(e.angle)*e.speed;
      e.y -= Math.cos(e.angle)*e.speed;
    }

    if(dist<400 && e.shootCooldown<=0){
      enemyBullets.push({
        x:e.x, y:e.y, angle:e.angle, speed:4
      });
      e.shootCooldown = enemyShootCooldownBase;
    }
    e.shootCooldown--;
  });

  /* 敵砲弾 */
  enemyBullets.forEach(b=>{
    b.x += Math.sin(b.angle)*b.speed;
    b.y -= Math.cos(b.angle)*b.speed;
    if(Math.hypot(b.x-player.x, b.y-player.y)<player.size){
      player.hp--;
      b.x = -9999;
    }
  });

  /* プレイヤー砲弾命中 */
  bullets.forEach(b=>{
    enemies.forEach(e=>{
      if(Math.hypot(b.x-e.x, b.y-e.y)<e.size){
        e.hp--;
        b.x=-9999;
        if(e.hp<=1){
          player.hp = Math.min(player.maxHp, player.hp+player.healBonus);
          explosions.push({ x:e.x, y:e.y, radius:5, alpha:1 });
        }
      }
    });
  });

  /* 敵削除 */
  for(let i=enemies.length-1;i>=0;i--){
    if(enemies[i].hp<=0) enemies.splice(i,1);
  }

  /* 爆発 */
  explosions.forEach(ex=>{
    ex.radius+=2;
    ex.alpha-=0.05;
  });
  for(let i=explosions.length-1;i>=0;i--){
    if(explosions[i].alpha<=0) explosions.splice(i,1);
  }
}

/* ============================
   respawn
============================ */
function checkRespawn(){
  if(player.hp<=0) return;
  if(enemies.length===0 && respawnTimer===0){
    respawnTimer = Date.now()+5000;
    wave++;
    giveRandomAbility();
  }
  if(respawnTimer!==0 && Date.now()>respawnTimer){
    spawnEnemies();
    respawnTimer=0;
  }
}

/* ============================
   draw
============================ */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#002";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.angle);
  ctx.fillStyle="#4af";
  ctx.fillRect(-player.size/2,-player.size,player.size,player.size*1.8);
  ctx.beginPath();
  ctx.moveTo(-player.size/2,-player.size);
  ctx.lineTo(player.size/2,-player.size);
  ctx.lineTo(0,-player.size*1.8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  enemies.forEach(e=>{
    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.rotate(e.angle);
    ctx.fillStyle="#f44";
    ctx.fillRect(-e.size/2,-e.size,e.size,e.size*1.6);
    ctx.beginPath();
    ctx.moveTo(-e.size/2,-e.size);
    ctx.lineTo(e.size/2,-e.size);
    ctx.lineTo(0,-e.size*1.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  ctx.fillStyle="#ff0";
  bullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle="#0ff";
  enemyBullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fill();
  });

  missiles.forEach(m=>{
    if(!m.target) return;
    const dx=m.target.x-m.x, dy=m.target.y-m.y;
    const ang=Math.atan2(dx,-dy);

    ctx.save();
    ctx.translate(m.x,m.y);
    ctx.rotate(ang);
    ctx.fillStyle="#ff4444";
    ctx.beginPath();
    ctx.moveTo(0,-10);
    ctx.lineTo(6,6);
    ctx.lineTo(-6,6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle="rgba(255,255,255,0.5)";
    ctx.beginPath();
    ctx.arc(m.x,m.y+10,4,0,Math.PI*2);
    ctx.fill();
  });

  explosions.forEach(ex=>{
    ctx.beginPath();
    ctx.arc(ex.x,ex.y,ex.radius,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,150,0,${ex.alpha})`;
    ctx.fill();
  });

  ctx.fillStyle="#fff";
  ctx.font="24px Arial";
  ctx.fillText("HP: "+player.hp+" / "+player.maxHp,20,40);
  ctx.fillText("Wave: "+wave,20,70);

  if(abilityTimer>Date.now()){
    ctx.fillStyle="#0f0";
    ctx.font="32px Arial";
    ctx.fillText(abilityText,canvas.width/2-150,80);
  }

  if(player.hp<=0){
    ctx.fillStyle="#f00";
    ctx.font="60px Arial";
    ctx.fillText("GAME OVER",canvas.width/2-150,canvas.height/2);
  }
}

/* ============================
   main loop
============================ */
function loop(){
  update();
  checkRespawn();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
