<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sea Battle HTML</title>
<style>
  body { margin: 0; overflow: hidden; background: #003; }
  #gameCanvas {
    width: 100vw;
    height: 100vh;
    background: linear-gradient(#1a3d6b, #0a1a33);
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
// ===============================
// 基本設定
// ===============================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ===============================
// キー操作
// ===============================
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// ===============================
// マウス長押し判定
// ===============================
let mouseDown = false;
document.addEventListener("mousedown", () => mouseDown = true);
document.addEventListener("mouseup", () => mouseDown = false);

// ===============================
// スマホタッチ判定
// ===============================
let touchShooting = false;
let touchX = 0;
let touchY = 0;

canvas.addEventListener("touchstart", e => {
  const t = e.touches[0];
  touchX = t.clientX;
  touchY = t.clientY;

  if (touchX > canvas.width / 2) {
    touchShooting = true;
  }
});

canvas.addEventListener("touchend", () => {
  touchShooting = false;
});

canvas.addEventListener("touchmove", e => {
  const t = e.touches[0];
  const dx = t.clientX - touchX;
  const dy = t.clientY - touchY;

  if (touchX < canvas.width / 2) {
    player.angle += dx * 0.005;
    player.x -= Math.sin(player.angle) * dy * 0.03;
    player.y += Math.cos(player.angle) * dy * 0.03;
  }

  touchX = t.clientX;
  touchY = t.clientY;
});

// ===============================
// プレイヤー船
// ===============================
const player = {
  x: canvas.width / 2,
  y: canvas.height / 2 + 150,
  angle: 0,
  speed: 2,
  size: 30,
  hp: 50,
  maxHp: 50,
  healBonus: 1,
  bulletSpeed: 6,
  shootCooldown: 0,
  shootCooldownBase: 20
};

// ===============================
// ウェーブシステム
// ===============================
let wave = 1;

// ===============================
// ランダム能力表示
// ===============================
let abilityText = "";
let abilityTimer = 0;

// ===============================
// 爆発エフェクト
// ===============================
const explosions = [];

// ===============================
// ミサイル能力
// ===============================
let missileUnlocked = false;
let missileCooldown = 0;
const missiles = [];

// ===============================
// 敵艦
// ===============================
const enemies = [];

function spawnEnemies() {
  enemies.length = 0;

  const enemyCount = 5 + (wave - 1) * 2;

  for (let i = 0; i < enemyCount; i++) {
    enemies.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height / 2,
      angle: Math.random() * Math.PI * 2,
      speed: 1.2,
      size: 25,
      hp: 3 + wave,
      shootCooldown: 0
    });
  }
}

spawnEnemies();

let respawnTimer = 0;

// ===============================
// 砲弾（プレイヤー）
const bullets = [];

// 砲弾（敵）
const enemyBullets = [];

// ===============================
// プレイヤー射撃
// ===============================
function shoot() {
  bullets.push({
    x: player.x,
    y: player.y,
    angle: player.angle,
    speed: player.bulletSpeed
  });
}

// ===============================
// ミサイル発射
// ===============================
function launchMissile() {
  if (enemies.length === 0) return;

  // 最も近い敵をターゲットにする
  let target = enemies[0];
  let minDist = Infinity;

  enemies.forEach(e => {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < minDist) {
      minDist = d;
      target = e;
    }
  });

  missiles.push({
    x: player.x,
    y: player.y,
    target: target,
    speed: 5
  });
}

// ===============================
// ランダム能力付与
// ===============================
let enemyShootCooldownBase = 180;

function giveRandomAbility() {
  const abilities = [
    "攻撃速度アップ",
    "移動速度アップ",
    "最大HPアップ",
    "回復量アップ",
    "砲弾速度アップ",
    "ミサイル"
  ];

  const choice = abilities[Math.floor(Math.random() * abilities.length)];
  abilityText = "能力獲得: " + choice;
  abilityTimer = Date.now() + 3000;

  switch (choice) {
    case "攻撃速度アップ":
      enemyShootCooldownBase = Math.max(60, enemyShootCooldownBase - 20);
      player.shootCooldownBase = Math.max(5, player.shootCooldownBase - 3);
      break;

    case "移動速度アップ":
      player.speed += 0.5;
      break;

    case "最大HPアップ":
      player.maxHp += 10;
      player.hp += 10;
      break;

    case "回復量アップ":
      player.healBonus += 1;
      break;

    case "砲弾速度アップ":
      player.bulletSpeed += 1;
      break;

    case "ミサイル":
      missileUnlocked = true;
      break;
  }
}

// ===============================
// ゲームループ
// ===============================
function update() {
  if (player.hp <= 0) return;

  // PC移動
  if (keys["w"]) {
    player.x += Math.sin(player.angle) * player.speed;
    player.y -= Math.cos(player.angle) * player.speed;
  }
  if (keys["s"]) {
    player.x -= Math.sin(player.angle) * player.speed;
    player.y += Math.cos(player.angle) * player.speed;
  }
  if (keys["a"]) player.angle -= 0.05;
  if (keys["d"]) player.angle += 0.05;

  // 長押し連射（PC + スマホ）
  if ((mouseDown || touchShooting) && player.shootCooldown <= 0) {
    shoot();
    player.shootCooldown = player.shootCooldownBase;
  }
  player.shootCooldown--;

  // ミサイル自動発射
  if (missileUnlocked && missileCooldown <= 0) {
    launchMissile();
    missileCooldown = 180; // 3秒
  }
  missileCooldown--;

  // ミサイル更新
  missiles.forEach(m => {
    if (!m.target) return;

    const dx = m.target.x - m.x;
    const dy = m.target.y - m.y;
    const angle = Math.atan2(dx, -dy);

    m.x += Math.sin(angle) * m.speed;
    m.y -= Math.cos(angle) * m.speed;

    const dist = Math.hypot(m.x - m.target.x, m.y - m.target.y);
    if (dist < m.target.size) {
      // 即死
      m.target.hp = 0;

      // 爆発
      explosions.push({
        x: m.target.x,
        y: m.target.y,
        radius: 5,
        alpha: 1
      });

      m.x = -9999;
    }
  });

  // プレイヤー砲弾更新
  bullets.forEach(b => {
    b.x += Math.sin(b.angle) * b.speed;
    b.y -= Math.cos(b.angle) * b.speed;
  });

  // 敵AI
  enemies.forEach(e => {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);

    e.angle = Math.atan2(dx, -dy);

    if (dist > 200) {
      e.x += Math.sin(e.angle) * e.speed;
      e.y -= Math.cos(e.angle) * e.speed;
    }

    if (dist < 400) {
      if (e.shootCooldown <= 0) {
        enemyBullets.push({
          x: e.x,
          y: e.y,
          angle: e.angle,
          speed: 4
        });
        e.shootCooldown = enemyShootCooldownBase;
      }
    }

    e.shootCooldown--;
  });

  // 敵砲弾更新
  enemyBullets.forEach(b => {
    b.x += Math.sin(b.angle) * b.speed;
    b.y -= Math.cos(b.angle) * b.speed;
  });

  // プレイヤーが敵砲弾を受ける
  enemyBullets.forEach(b => {
    const dist = Math.hypot(b.x - player.x, b.y - player.y);
    if (dist < player.size) {
      player.hp--;
      b.x = -9999;
    }
  });

  // プレイヤー砲弾 → 敵に命中
  bullets.forEach(b => {
    enemies.forEach(e => {
      const dist = Math.hypot(b.x - e.x, b.y - e.y);
      if (dist < e.size) {
        e.hp--;
        b.x = -9999;

        if (e.hp <= 1) {
          player.hp = Math.min(player.maxHp, player.hp + player.healBonus);

          explosions.push({
            x: e.x,
            y: e.y,
            radius: 5,
            alpha: 1
          });
        }
      }
    });
  });

  // HP0の敵を削除
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].hp <= 0) enemies.splice(i, 1);
  }

  // 爆発更新
  explosions.forEach(ex => {
    ex.radius += 2;
    ex.alpha -= 0.05;
  });

  for (let i = explosions.length - 1; i >= 0; i--) {
    if (explosions[i].alpha <= 0) explosions.splice(i, 1);
  }
}

function checkRespawn() {
  if (player.hp <= 0) return;

  if (enemies.length === 0 && respawnTimer === 0) {
    respawnTimer = Date.now() + 5000;
    wave++;

    giveRandomAbility();
  }

  if (respawnTimer !== 0 && Date.now() > respawnTimer) {
    spawnEnemies();
    respawnTimer = 0;
  }
}

// ===============================
// 描画
// ===============================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#0a1a33";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // プレイヤー船
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  ctx.fillStyle = "#4af";
  ctx.fillRect(-player.size/2, -player.size, player.size, player.size * 1.8);

  ctx.beginPath();
  ctx.moveTo(-player.size/2, -player.size);
  ctx.lineTo(player.size/2, -player.size);
  ctx.lineTo(0, -player.size * 1.8);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // 敵艦
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);

    ctx.fillStyle = "#f44";
    ctx.fillRect(-e.size/2, -e.size, e.size, e.size * 1.6);

    ctx.beginPath();
    ctx.moveTo(-e.size/2, -e.size);
    ctx.lineTo(e.size/2, -e.size);
    ctx.lineTo(0, -e.size * 1.6);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  });

  // プレイヤー砲弾
  ctx.fillStyle = "#ff0";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // 敵砲弾
  ctx.fillStyle = "#0ff";
  enemyBullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // ミサイル描画
  ctx.fillStyle = "#0f0";
  missiles.forEach(m => {
    ctx.beginPath();
    ctx.arc(m.x, m.y, 6, 0, Math.PI * 2);
    ctx.fill();
  });

  // 爆発描画
  explosions.forEach(ex => {
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,150,0,${ex.alpha})`;
    ctx.fill();
  });

  // UI
  ctx.fillStyle = "#fff";
  ctx.font = "24px Arial";
  ctx.fillText("HP: " + player.hp + " / " + player.maxHp, 20, 40);
  ctx.fillText("Wave: " + wave, 20, 70);

  if (abilityTimer > Date.now()) {
    ctx.fillStyle = "#0f0";
    ctx.font = "32px Arial";
    ctx.fillText(abilityText, canvas.width / 2 - 150, 80);
  }

  if (player.hp <= 0) {
    ctx.fillStyle = "#f00";
    ctx.font = "60px Arial";
    ctx.fillText("GAME OVER", canvas.width / 2 - 150, canvas.height / 2);

    ctx.font = "40px Arial";
    ctx.fillText("Wave " + wave + " まで生き残った", canvas.width / 2 - 200, canvas.height / 2 + 60);
  }
}

// ===============================
// メインループ
// ===============================
function loop() {
  update();
  checkRespawn();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
